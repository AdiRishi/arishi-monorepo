packages:
  - apps/*
  - infra
  - packages/*
  - scripts
  - tooling/*
  - workers/*

# Node gives each address 250 ms to connect before trying the next. Cloudflare's
# API can take longer on some networks, so every attempt times out and Alchemy
# reports its state store as missing.
nodeOptions: "${NODE_OPTIONS:- } --network-family-autoselection-attempt-timeout=2000"

catalog:
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  "@alchemy.run/test": 2.0.0-beta.85
  "@base-ui/react": 1.9.0
  "@cloudflare/vitest-plugin": 1.7.0
  "@cloudflare/workers-types": 5.20261110.1
  "@effect/platform-browser": 4.1.3
  "@effect/platform-bun": 4.1.3
  "@effect/platform-node": 4.1.3
  "@effect/platform-node-shared": 4.1.3
  "@effect/sql-d1": 4.1.3
  "@effect/sql-sqlite-do": 4.1.3
  "@effect/tsgo": 0.67.7
  "@effect/vitest": 4.1.3
  "@fontsource-variable/inter": 5.3.0
  "@oxlint/plugins": 1.93.0
  "@playwright/test": 1.65.0
  "@tailwindcss/vite": 4.3.5
  "@tanstack/devtools-vite": 0.8.6
  "@tanstack/react-devtools": 0.10.14
  "@tanstack/react-query": 5.107.1
  "@tanstack/react-query-devtools": 5.107.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-router-devtools": 1.167.3
  "@tanstack/react-router-ssr-query": 1.167.3
  "@tanstack/react-start": 1.169.5
  "@tanstack/router-plugin": 1.169.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vgpu/wgsl": 0.6.0
  "@vitejs/plugin-react": 6.3.0
  "@vitest/browser-playwright": 5.1.0
  "@webgpu/types": 0.1.74
  alchemy: 2.0.0-beta.85
  blume: 2.2.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  effect: 4.1.3
  lucide-react: 1.71.0
  miniflare: 5.20261110.0-beta
  playwright: 1.65.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2006
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.23.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  turbo: 2.11.10
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vgpu: 0.6.0
  vite: 8.3.8
  vitest: 5.1.0
  vitest-browser-react: 2.3.0
  web-vitals: 6.2.3
  yaml: 2.9.1

allowBuilds:
  "@scarf/scarf": false
  "@tailwindcss/oxide": true
  "@vgpu/adapter-node": false
  esbuild: true
  msgpackr-extract: false
  sharp: true
  webgpu: false
  workerd: true

minimumReleaseAge: 1440

# Effect's HTTP, RPC and SQL modules can change in a minor release, and Alchemy
# depends on Effect packages with caret ranges. Hold every Effect package, direct
# or transitive, to the catalog's version.
overrides:
  "@effect/platform-browser": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/vitest": "catalog:"
  effect: "catalog:"

peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.16>typescript": "7"
